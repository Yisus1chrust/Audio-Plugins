name: Build Photo Synth WebView Plugins

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build plugin targets
        run: cmake --build build --config Release --parallel

      - name: Package plugin artifacts
        run: |
          mkdir -p artifacts
          find build -type d -name "*.vst3" -exec cp -R {} artifacts/ \;
          find build -type d -name "*.component" -exec cp -R {} artifacts/ \;

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSynthWebView-macOS
          path: artifacts

  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Collect VST3 artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Get-ChildItem -Path build -Recurse -Filter *.vst3 | ForEach-Object {
            Copy-Item $_.FullName -Destination artifacts -Recurse -Force
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSynthWebView-Windows
          path: artifacts
